l_simp_chinese:
 classics_and_rebirth: "古典与新生"
 classics_and_rebirth_desc: "第二次世界大战带来的满目疮痍并没有随着预想中的重建而恢复，正好相反的是它开始化脓和感染。在亚洲，诸夏巨龙的宝座已经因南洋民族解放运动、群山帝国的复仇主义与来自东北亚学院派革命者的威胁处在分崩离析的边缘。在欧洲，战争的余烬和无边血潮汇聚成的混沌洪水誓要将欧罗巴再度涤荡，地中海的烈火与斯堪地维亚的坚冰、雄鸡与猎鹰彼此碰撞。在非洲，战争与挣扎永不停歇地撕扯着旧时代文明的故乡，古老的部族与新生的起义接连不断。而在血海之中，历史与未来如一叶孤舟愈发飘向远方......"
 the_dance_of_wild_wilderness: "蛮荒之舞"
 the_dance_of_wild_wilderness_desc: "第二次世界大战并未分出真正决定性的胜负，但霸权与诸国已经处在深渊的边缘。在美洲的极北之地，寒风与暴风雪催生的国度正在将其触角伸向别处。而在纷争的南部，所有虫都有着自己期望依靠新战争达成的目标，不论这目标究竟为何。在中美洲，亚马逊的诸城邦正畏缩在壁垒之后观看新玛雅与新阿兹特克的角力。在南美洲这属于蚁群的大地，烈火王国的女皇剑指南北，与之对峙的阿根廷蚁却也在酝酿着一场心灵的风暴。但在浩劫之中，一个新秩序终将降生。"

 BRF_CLASSICS_AND_REBIRTH_DESC: "婆罗多联邦，一个保存着过去人类文明信息残片的国度，继承了来自她所在地古老文明的许多事物：达利特、首陀罗、吠舍、刹帝利、婆罗门五种姓，以及随之并生的信仰和文化。在近百年的技术爆发时期，虽然诸邦统一在了一面旗帜之下但，各邦的隔阂和冲突却也持续不断。即便如此，婆罗多联邦依然维持着对外的团结，而不是陷入混沌与战乱之中。\n\n作为第二次世界大战里的中立国，婆罗多联邦并未过多地受到战火的波及。在群山帝国与诸夏陷入地狱般的消耗战后，婆罗多联邦的王侯将相选择了不介入战争以明哲保身。群山帝国的结局令联邦的大多数婆罗门、刹帝利种姓为他们明智的选择而自傲，但这并不代表婆罗多联邦能够同样躲避战后席卷世界的滔天巨浪：由崛起的学院派创造的汹涌波涛。\n\n而这一问题的存在是显而易见的：虽然婆罗多联邦高度分化的种姓体系在百年时光中尚处于能够忍受的程度，但随着一系列自动化生产设备因技术进步而诞生，过去以工虫为主体的首陀罗阶层却开始被逐渐淘汰。占社会成员半数以上的首陀罗种姓大规模地失业，沦为无业游民与无家可归者。在如此局面下，婆罗多的社会陷入了前所未有的猛烈动荡。以食蚜蝇为首的无政府主义组织也随之成长、愈发壮大，似乎过去千百年积攒的仇恨与怒火将在此刻彻底爆发，将整个婆罗多联邦拖下地狱。\n\n放眼更加广阔的亚洲，正在从一系列创伤中恢复的群山帝国也与婆罗多的关系愈发紧张：群山帝国将在把怒火撒向亚洲的同时建立帝国霸权，婆罗多自然也没有幸免的可能。两国的关系紧张无比，但事情终归需要做出了结……婆罗多联邦正处于历史的十字路口，此时此刻，无数虫类——从最低等的不可接触者，到最为博学的婆罗门——所有虫的抉择汇聚在一起，编织成一份答卷：宣判其命运的答卷。"
