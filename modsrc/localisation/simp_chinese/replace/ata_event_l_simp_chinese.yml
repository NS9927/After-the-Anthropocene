l_simp_chinese:

 brf.1.t: "婆罗多的清晨"
 brf.1.d: "清晨的码头已经开始忙碌起来。近百米长的货船上，货物被分批次地卸下，输送到婆罗多联邦的更深处。而在这平凡的港口区，老独眼也才从几块遮风挡雨的布料垃圾中醒来。他看到天色已是清晨，抖了抖身上的灰，紧接着便以佝偻的身躯前去赶路了。\n\n确切来说，“老独眼”并不是这个看起来平凡无比的老苍蝇的本名，但这个由玩耍的幼虫为他起的名字还是被他接受了。毕竟，婆罗多社会最低贱且可有可无的达利特虫类向来是没有名字的，一个外号在此时也变得格外珍贵。哪怕是在同一种姓的虫面前，老独眼也会夸耀自己的这个称呼。老独眼并不知道他的家族和家虫，他从小便是在废品和垃圾堆里长大的。在这片港口城市中，和他相似的虫也不在少数。尽管如此，老独眼还是会对那些因比自己高一等而沾沾自喜、高高在上的虫感到嫉妒，更何况在婆罗多联邦之中，除去自己种姓以外的任何虫都比自己更加高贵。上一等的虫对下一等只有白眼，却又在遭受更上一等的蔑视。千百年来，永远如此。\n\n老独眼那只作为低贱烙印的、醒目的红色眼睛伴随着他的一生，但为数不多的些许好处在于：至少那些处理垃圾的活计不会再有首陀罗和吠舍来抢占了，自己在过去几年的虫生中也能靠着这件事换些饭吃。总的来说，日子还算能过下去——尽管时常有着已经把他折磨到麻木的痛苦，但日子还是能过下去。而最近的几周，也有很多首陀罗的虫似乎因为港口引进了更先进的自动机器而失业？不过老独眼也并不关心，他不是什么喜好幸灾乐祸的虫。"
 brf.1.a: "一边这么想着，他开始寻找着垃圾和尸体"

 brf.2.t: "践踏"
 brf.2.d: "当正午的烈日无情洒下，恒河邦的城市社会也如天空中的太阳一样运转着。这时，一只拥有达利特红色眼睛的蟑螂也正忙于清理一小片垃圾来换取一些食物。在她附近还有一只带着吠舍特有的青色眼睛的年轻瓢虫，正与他的几位伙伴谈笑着走过此地。就在看到那只红色眼睛的蟑螂之后，那位富商似乎是想到了什么，对他的朋友窃窃私语起来。短暂的谈论之后，他飞了起来，又故作失误地落在地上。而那蟑螂似乎还未关注旁边的状况，她仍然只是麻木地拾着垃圾。但突然间，一根棍子砸断了她的腿，那是富商和他的两个伙伴大笑着如此做的。没有解释，没有道歉。紧接着她的脑袋又挨了一棍子，然后是腹部。\n\n直到那富商和两虫终于满意的时候，那可怜的蟑螂已经成了一具残破的尸体，而旁边的军警只是看着一切的发生，最终在一切结束之后象征性地问道：\n\n“为什么夺去她的性命？”\n\n“她在我跌倒的时候没有帮忙！而且还不肯避让我的影子！这小贱种可是违法了！”\n\n那军警似乎又象征性地思考了一下，最终用机器开出了一张罚单，丢给正在窃笑的富商。富商接了过来，然后在上面签了自己的名字。这将会扣除他的一些财富，只是大抵微不足道罢了。\n\n至于四周，也有几位带着红色眼睛的虫旁观着这一切，他们的眼中没有恐惧，也没有愤怒。唯一存在的只剩下了麻木。"
 brf.2.a: "本该如此"

 brf.3.t: "失业潮"
 brf.3.d: "“什么——为什么要裁我们？！”一阵惊呼从恒河邦的一座工厂里传来，那是一群带着不解和疑惑的、有着灰色眼睛的首陀罗工虫，他们带着伤疤的疲惫脸庞在此时此刻被惊讶和怒火充斥着。作为这座老工厂的工虫，他们自打出生就被父母签下了卖身契，虽然工厂被恶臭和肮脏弥漫，配给食物称不上佳肴，自己也必须对那些高种姓低声下气，但至少日子还能过得下去。厂长的话响起的时候，已经有几个蚂蚁和苍蝇想要拿起扳手了。\n\n“真的不是我们要谋杀你们……我只是传个话……”那吉丁厂长的不安已经达到了顶峰，但他还是硬着外骨骼说了下去——\n\n“上面的企业是说，我们厂换上了最新技术造出来的自动机器，所以不需要你们了……”说出这话的时候，他的脑袋已经缩到了大衣里。他真的非常害怕这些与他一个种姓的虫下一秒就会把他撕成碎片。此话一出，一阵激烈的喧嚣和咒骂便从下方的虫中响起。但这些声音大多仅持续了几秒便消失了。毕竟，婆罗多虫已经习以为常了。那些工虫最终还是选择默默散去，留下厂长一个虫在这片寂静的工厂中。而在这时，他的内心也不禁产生了一个问题：为什么这些本可以让所有虫感到高兴、让首陀罗不再需要过分艰苦劳作的消息，却反而夺走了他们的工作和生存权呢？"
 brf.3.a: "为什么呢"

 brf.4.t: "预备庆典"
 brf.4.d: "舞者深吸了一口气，她的灰色眼睛中闪烁着些许不安。毕竟，这个时代就是这样的，她们这些虫子尤其要活得小心翼翼些。当年，自己与十多个姊妹还是虫卵时，便被自己素未谋面的母亲卖给如今所在的公司抵债。这样的说辞仍然回荡在自己的耳边，毕竟，他们家的孩子太多了，即使几十个在严苛的训练中死去，也不会是什么值得注意的大事。在随后的日子里，许多与她一路的虫都由于各种各样的原因死去：或许是过度的疲劳，或许是再也承受不住这莫大压力的摧残，或许是粗制滥造的植入体产生了排异反应，又或许是最简单的、因成绩不好而被“淘汰”掉。但舞者依然活着，并且步步攀升。她也说不上来自己为什么有如此强大的生存执念，或许她也想要有朝一日在她素未谋面的母亲面前大显身手，但她也很难把握答案。\n\n自己可不能掉以轻心，舞者这么提醒道。当下是自己需要好好表现的时候，特别是在这个婆罗多联邦的佳节庆典上。自己也是第一次面对如此庞大的舞台和目光的注视，这与她过去的任何一次表演都不一样。如果自己因为疏忽或是植入体故障在这次表现中出了洋相……"
 brf.4.a: "那等待自己的是什么自然显而易见"

 brf.5.t: "并不愉快的佳节庆典"
 brf.5.d: "节日永远是婆罗多社会不可或缺的一环，民俗和宗教信仰规范的种种节日也是满足社会公众娱乐的头等大事，在当下亦是如此。尽管经济的萧条、联邦的乱局，以及数量愈发庞大的失业潮都在让婆罗多世风日下，但眼下的佳节庆典还是如期举行。虽然过往欢快的氛围似乎很难重现，但民众还是在文化的惯性下装点民居并一起舞蹈。似乎一时间眼下诸土邦的阴云也被这欢快的气氛冲淡了，哪怕只是暂时的。\n\n而就在这时，一位用鲜花装点自己的蝴蝶舞者也吸引了群众的注意力，她曼妙的舞姿惹得群众发出了阵阵喝彩。但夹杂在群众中的几位首陀罗却攥紧了拳头，其中一虫也悄然地将他的手伸向腰间。\n\n“这位女士，”一句话自喝彩中出现，打断了舞者的表演，“作为婆罗门培养的舞者而为公众演出，您不觉得您在做的是麻痹虫民的事吗？您不认为这是莫大的耻辱吗？”\n\n舞者还来不及反应，公众也没从这质问中回过神来，但那虫却看起来有些激动地抬起了一只手，握着一把电磁步枪指向了舞者。\n\n“去死吧！走狗！”怒吼自这虫的口中迸发出的时候，群众的思考才跟上现状。恐慌正在蔓延，而舞者已经听不到了。"
 brf.5.a: "因为冰冷的子弹已经穿透了她的头颅"

 brf.6.t: "汇报：婆罗多民众同盟"
 brf.6.d: "在席卷整个婆罗多联邦的暴力冲突之下，更深处的阴影也在浮出水面。愈来愈多发生于各个土邦的刺杀和恐怖袭击中，一个名为“婆罗多民众同盟”的名号开始逐渐频繁地出现。前不久的庆典上，全国众目睽睽之下突发的刺杀事件已经让婆罗多联邦处于恐惧与虫虫自危当中，而随后刺客自杀留下的、宣称“革命将至”的遗书更是引发了当局的关注。但直到目前为止，刺杀和恐怖袭击的规模仍然较为有限，婆罗多民众同盟也仍未公开活跃或展露踪迹。目前为数不多能够掌握的信息，便是婆罗多民众同盟可能与无政府主义者食蚜蝇有着千丝万缕的联系，除此之外却无法掌握任何更多资料。因此直到目前为止，我们能做的也只有静待收集情报……"
 brf.6.a: "……以及祈祷事态不会继续恶化"

 brf.7.t: "相遇（上）"
 brf.7.d: "当一只长着红色眼睛的蝗虫若虫在垃圾场与一只长着灰色眼睛的蝽若虫相遇，话题很快就被点燃了。\n\n“你们的眼睛……为什么是红色的啊？”蝽若虫最先问道。\n\n“不知道，听跟我眼睛一个颜色的虫说，这些是神灵给我们的惩罚，因为我们前世都是罪虫。”蝗虫若虫解释道。\n\n“可……我看我们都一样是虫啊？虽然我的爸爸说让我离你们远点，说你们是贱民，但你们和我们不一样是虫吗？”\n\n“你们的工作是劳动，我们的工作是处理垃圾和尸体。我们的工作比你们低贱。”那蝗虫若虫看起来也动摇了，但他还是坚定地回应道。\n\n“可……我的爸爸妈妈最近也都失业了，我们家里很多虫都失业了啊？那我们没有工作了是不是比你们还要低贱？而且那些金色眼睛和黑色眼睛的，他们除了研究和打仗都不工作啊！”那蝽若虫似乎是不太服气，这么反驳道。\n\n“我……”蝗虫若虫似乎也无言以对了。就在他们还在争执的时候，一个披着斗篷，带着黄黑条纹身子和一对翅膀的虫却默默观察着。最终，他也只是叹了口气。"
 brf.7.a: "如果早会是这样，我们为什么会至如此境地"

 brf.8.t: "相遇（中）"
 brf.8.d: "“你们有没有想过一个问题……”那个披着斗篷的身影悄悄靠了过来，而这也把两个若虫吓了一跳。\n\n“你们怀疑了，这很好。只是……你们有没有想过，不对的地方应该改变，就像一道错误的题？”他缓缓地退下斗篷，露出一个有着红色眼睛的面孔。从翅膀来看，像是一个双翅目昆虫，一只食蚜蝇。他的双眼看起来有些疲惫，却也带着如同烈火一样的神色。那仿佛是把欣赏、怒火与煽动力混杂在一起产生的酱汁。\n\n“改变？”两只若虫异口同声地问道。\n\n“也许——只是也许，你们有没有想过，我们或许可以一起生活在一片屋檐下，工作只是分工的不同而非地位的划分？一个——眼睛的颜色只是特点而不是印记的土邦？”他试探性地如此问道。\n\n“这……”那蝽若虫若有所思，但蝗虫若虫看上去只是害怕地摇了摇头。\n\n“那太离经叛道了！”\n\n“离经叛道？当他们宣称着保卫国家、高瞻远瞩，实则却伤害着他们说要保护的虫，他们遵守什么规章了吗？”那虫紧接而来的发问，如同刺向敌虫破绽的长矛。\n\n“可，可是……”那蝗虫若虫再一次不知所措起来，但那虫摇了摇头。"
 brf.8.a: "你会很快理解这个问题的"

 brf.9.t: "相遇（下）"
 brf.9.d: "“那，你是谁啊？”蝽若虫好奇地追问道，在他的记忆中他从未听到过有虫这么教导自己，也没有虫告诉自己这种事情。\n\n那虫思考了片刻，露出一个狡猾的笑容：\n\n“我只是一只食蚜蝇，一个微不足道的达利特，但我不介意成为虫民精神的军师。你们还很年轻，这是很好的事情，因为婆罗多的未来在你们手上。”\n\n“可……他们都说我们祖国的未来是众生业力轮转决定的啊？”蝗虫若虫终于想好了他的问题，随即问道。\n\n“可能如此，但你们才是众生。”食蚜蝇回答道，随后拿出了一本黑色的书——尽管蝗虫若虫不识字，但蝽若虫发现那是一本名写着“新大悲心陀罗蚭经”的书。翻了几页，内容无非是识字班里学过的《大悲心陀罗蚭经》。但到了下一章，却看到标题上赫然写着“国家制度与无政府主义”。\n\n就在两虫还在好奇的时候，食蚜蝇开口道：\n\n“如果跟我走，也许你们的疑惑会得到一些解答。”他保持着狡猾的笑容。\n\n“那我们还等什么呢！”蝽若虫随即拉起了蝗虫若虫，他们灰色和红色的眼睛在这片城市的角落中交错。"
 brf.9.a: "赶紧来吧！"

 brf.10.t: "被劫持的频段广播"
 brf.10.d: "这处临近恒河的城市广场正处于几近正午的时刻，而四周来往的虫却没有多少忙于工作或是其它的事情。在这片被划分出的属于首陀罗与达利特混杂的城区，自动化机器的普及已经夺走了上万虫的工作。而正是在这个时候，老独眼——一个没有名字的达利特老苍蝇也正在随着公众而一同漫无目的地前行，他也不知道该做些什么，只是看着越来越多的虫带着愤怒或麻木从他们工作的工厂中被驱走，然后加入自己的行列，成为丢失工作又无可奈何的无业游民。至少在此时，首陀罗与达利特实现了难得的平等待遇？老独眼的内心不知为何突然划过了这样的一个幸灾乐祸的念头。而就在他只是行走的时候，几个身影披着黑色的斗篷的怪虫跟老独眼擦肩而过，老独眼还没来得及看清楚这是什么虫，就发现广场的中心的广播停下了几周以来的白噪音，随后一阵有显著的北方口音的、似乎是从未知区域劫持的广播面对公众开口了：\n\n“诸位——吠舍们、首陀罗们、达利特们——婆罗多的国民同胞们！”当这如同惊雷一样突如其来的演讲在广场上响起的时候，公众还未来得及反应过来。而当听清了广场中心的虫的口音后，无数夹杂着困惑、好奇、鄙夷、厌恶等诸如此类的目光便向广播电台压去。\n\n“我们可能来自于不同的种姓，也来自于不同的家族和身份，但现在，命运已经将我们推向了相同的十字路口——在婆罗门与刹帝利，以及一些吠舍无尽的贪婪与侵害之下，我们已无路可退！”他的声音在偌大的广场响起，却也引起了群众的些许共鸣。\n\n“时至今日，还有多少虫敢于宣称他的生活仍然可以维持？还有多少被高种姓视为‘渺如微尘’的虫能够从这样的无妄之灾中独善其身？一个生机勃勃的世界的命脉恰恰把握在你们这些虫类的手中！那些最为根基，最为低贱，被踩到最深处的虫！而不是那些高高在上辩论经文的婆罗门或是徒有其表的刹帝利！他们宣称了各司其职而运行的生活，但他们已经再也无法兑现这承诺了！\n\n“倘若你们也已忍无可忍，那么请加入我们的行列吧！我们是婆罗多的虫民之子，我们是婆罗多民众同盟，最重要的是——我们是无政府主义者！”最后一句话几乎是被他喊出来的，而在现场的群众也被这演讲在一时间所震慑，而后，公众仿佛陷入了某种沉思，他们变得默不作声，就像刚才的麻木不堪一样，但又好像发生了细微的变化。而在群众中，有几个样子看起来异常年轻的虫也悄然下了什么决定，而在他们与彼此目光交错的一瞬间，他们轻微地点了点头。\n\n至于老独眼，他还震惊于这离经叛道的话。但他还没来得及靠近，广场中心的虫便迅速地离开了。老独眼也看着军警赶来却又一无所获，他却并没有说任何事情。"
 brf.10.a: "而在他的内心深处，某些东西似乎也在悄然萌发"

 brf.11.t: "汇报：广播劫持事件"
 brf.11.d: "在一系列不断传来的恐怖袭击之后，婆罗多民众同盟再次策划了一场庞大的电台劫持。在过去的二十四小时内，印度河邦、马尔瓦邦与孟加拉邦的大量城市电台广播被黑客劫持并且发布了大量的宣传内容。尽管具体内容不同，但其大多数为煽动群众、宣传无政府主义与鼓吹对高种姓复仇的演讲和号召。此事不仅使得各个邦的恐慌情绪开始扩大，也严重影响了婆罗多联邦的政府威信，并且可能对于本不稳定的婆罗多社会造成极大的不良影响。\n\n为了防止社会恐慌的扩大化，婆罗多联邦总理那迦粉蝶已经宣布将尽力动员各土邦的军警和其它部队参与调查和打击恐怖组织，以及宣布国内部队进入戒备状态。除此之外，马尔瓦邦与孟加拉邦政府也正在许诺向公众解决婆罗多民众同盟的恐怖活动影响与广泛存在的失业问题，并且呼吁公众“拒绝不法思想与组织，并且积极举报可疑虫类”。"
 brf.11.a: "但愿事情到此为止"
 brf.11.a.tt: "§R但一切不会如愿……§!"

 brf.12.t: "秘密活动"
 brf.12.d: "在恒河邦充满阴雨的这天，城市的穹顶已早早地关闭，以预防雨水可能对城市的破坏或是造成民众伤亡。但正在这一天，几个带着灰色或者红色眼睛的虫却在小心翼翼地于都市的下层前进着，他们反复确认四周没有来者后，最终停在了一个靠近恒河的堡垒。营地前似乎是把守者的虫，在反复确认了他们的身份之后让出了一条路。而在进入之后，他们终于见到了此行的目标：眼前来自于东南亚的商虫——一只竹节虫。他的眼中充斥着精打细算，而身旁还有两名高大的甲虫作为护卫。\n\n“一手交钱，一手交货。”他指了指四周满目的弹药和枪械与其它武器，这么说道。\n\n“当然。”那几个虫中的一位打头的蝉说道，他指了指身后，随行虫端上一块箱子大的蓝宝石，以及几箱珍珠。见到了他们的东西，那竹节虫看起来也颇为高兴。\n\n“这东西放在哪里都是珍宝——”\n\n“它们来自于虫民和我们同志的筹集，它是虫民的珍宝。但这些珍宝只是陈物，我们需要真正的枪支和武器。”那只蝉这么开口了，他看向竹节虫，眼睛里看不出任何情感。那竹节虫也识趣地停下了说话，在短暂的沉默和检验货物之后，他不禁开口了：\n\n“知道吗？有时候我确实也挺喜欢你们这帮安那其的。至少你们的精气神看着比这片地方大多数虫都要足得多。”他最后这么说道。但就在他带着自己的保镖离开大门之前，一句话突然从身后的蝉口中说出："
 brf.12.a: "谢谢"

 brf.13.t: "汇报：婆罗多民众同盟新动向"
 brf.13.d: "经过举报与调查，我们在印度河邦发现了大量来路不明的武器走私行为。通过初步追溯，我们发现来自南洋都护府与其它临近婆罗多联邦的国家出现了大量匿名的武器订单和流向不明的贸易行为。这些活动极为隐秘，我们的探员同样耗费了极大精力才勉强锁定了几个贸易据点。而大多数走私行为的情报仍然并未被我们掌控。显而易见，我们能够根据这些活动拼凑出一件令虫不安的真相：婆罗多民众同盟正在囤积大量武器密谋暴乱。而面对这幅图景，我们必须立即做出举措以确定事情在不可挽回之前得到控制，动员我们所能动员的一切情报员和军警，不惜一切代价收集婆罗多民众同盟的情报，并且争取将他们一网打尽。"
 brf.13.a: "亡羊补牢，但愿吧"

 brf.14.t: "争执"
 brf.14.d: "在婆罗多又一个被失业、民怨和不安的包裹不眠之夜里，冲突也在所难免。而放在婆罗多联邦一座小城的首陀罗社区里，就更是常见了。\n\n“我说了，不要冒险去干这种事！”声音的来者是一个看上去已经老态龙钟的首陀罗工虫苍蝇，她那灰色的目光充斥着急切和忧虑：“你是我看着长大的，我不能看着你去送死！”\n\n“我知道，但我们就这么在城里等着饿死一样是死路一条！”另一个声音则是来自于与前者品种不同的一个蜚蠊目昆虫，他的目光中却闪烁着热情和烈火，“蝇奶奶，我们已经只剩下这一条路可走了！食蚜蝇同志的号召正在民众间传播，我们也该动身了！”\n\n“不论如何，只要我还活着，我们这个社区就不会掺和些什么‘无政府主义革命起义’的事情，想都别想！”她斩钉截铁地强调道，随后又补上一句：“我还有些配给食物，不要冲动到去干这种事情。”\n\n“可那些跟我一个辈分的年轻虫——”\n\n“他们最终会死无葬身之地。”被叫做蝇奶奶的首陀罗工虫深深地叹了口气，这么强调道，“我们战胜不了他们，你们的路子我很早以前就在那些工会里见过了。”\n\n“那只是脱离群众的单打独斗和改良主义……至少食蚜蝇同志在书里是这么教育我们的……”\n\n“或许吧，但就算赢了又如何？我可见多了，不就是换了群管事的吗？最后该怎么样还是怎么样，可能还更差点。”她坚定地强调道——\n\n“不论如何，好好记着点……”"
 brf.14.a: "我们只是虫啊"

 brf.15.t: "觉悟"
 brf.15.d: "马尔瓦邦的日常固然是枯燥乏味的，但是近期愈来愈多的暴力冲突和恐怖袭击，竟也让虫怀念起了它过去无趣但平静的日子。而在这样的日子里，一个虫悄悄敲响了位于城市地下一处贫民窟据点的门。\n\n“喔！伙计们，放心，是自己虫！”看着用电磁步枪指向自己的一众达利特拾荒者和首陀罗工虫，眼前拥有蓝色眼睛的一位似乎是吠舍的瓢虫这么强调道，他举起四只手示意自己没带武器，望向他的目光也开始渐渐放下了戒备。\n\n“你从哪来的？暗号是什么？”第一个质疑来自于一名首陀罗工虫，她不放心地这么问道。\n\n“恒河；到街垒去。”他对答如流道。\n\n“我们凭什么相信你这个吠舍？”第二个问题是一位达利特拾荒者没好气的提问，它也比第一个尖锐得多。\n\n“我……决心做点什么，婆罗多正在变成地狱，而我很清楚这就是无数不公堆成的——我们唯有革命一条路可走！我是在做对得起良心的事。”他这么异常坚决地强调道：“所以请让我加入你们吧，你们可以调查我们来历，我保证绝对干净！”\n\n“整的好像你们拿我们当实验品的时候有什么良心一样……”那个达利特拾荒者骂了一句，但还是放下了枪口。\n\n“我知道你们肯定不相信我，但你们就放心调查吧。我是一名知识分子，一名学院派支持者。我只是在秉持枯叶蛾女士的教诲：倘若我们的起义不胜利，这片土地上就别想有正义和公正！”他最后这么强调着，又进来看了看。\n\n“一个蓝眼睛的安那其……”仍有一虫这么不放心地重复着。"
 brf.15.a: "真的会有虫背叛自己的种姓吗？"

 brf.16.t: "秘密集结"
 brf.16.d: "一位首陀罗白蚁工虫经历了几个守卫的盘问，终于进入到了一台庞大的、等待回收的、废弃陆地战舰中的演讲现场时，他的目光很快落在了演讲的中心：身披棕色斗篷、过去自己只在地下宣传册上和广播中听闻过的食蚜蝇身上。此时他的演讲正处于高潮，近乎咆哮一般的演讲也瞬间让他的心脏为之震颤。\n\n“……而正是因为如此，我们——所有的低贱者和被欺压者，都要在这个世界发出我们自己的呐喊！我们千年以来的苦难和仇恨将在不久后化作风暴：虫民之风！”食蚜蝇的红色眼睛虽然让那位白蚁愣了一瞬间，但他也立刻端正了自己的态度，找了个空的位子坐了下来。\n\n“我们将在婆罗多创造斑斓的血海，用婆罗门和刹帝利的血液作为它的颜料。而在血海中，在旧婆罗多的尸骸上，我们将以它们为材料构筑起我们公正、崭新的新婆罗多！”食蚜蝇的演讲没有停下或者被突如其来的进入者打断，他继续强调着。\n\n“……你们来自于印度河邦，你们则来自于马尔瓦邦，而你们，则是孟加拉邦的受难者。我们在此汇聚，也将化身为咆哮的洪流！我们是风暴，是雷霆，未曾有哪位君王能够束缚住这些东西，而我相信你们亦不会！我们便是暴民——对抗暴君的暴民！”演讲到了最后阶段，倾听者的亢奋已经无法抑制，欢呼、咆哮与呐喊的声音在一排排座位间响起。此时恐怕就算食蚜蝇命令在场的虫割喉自杀，至少一半的虫也会立即照做。至于那位白蚁劳工，他也狂热地呐喊着，以及有一些提到了自己家乡的欣喜之情。"
 brf.16.a: "虫声鼎沸"

 brf.17.t: "汇报：马尔瓦邦爆炸案"
 brf.17.d: "近期，一场爆炸案震撼了马尔瓦邦的社会局势：一枚被事先埋藏于马尔瓦邦政府地下的炸弹被引爆，它很快便摧毁了整个政府办公楼和其中的大多数政府虫员。目前军警正在搜救幸存者，但与此同时马尔瓦邦也爆发了大规模的暴乱和骚动。尽管骚乱被很快平息，但很显然可以确定这是来自婆罗多民众同盟的袭击。目前，婆罗多联邦政府正在对婆罗多民众同盟展开严厉谴责，并且调遣大量军队进驻马尔瓦邦以确保局势不至于全面失控。"
 brf.17.a: "赤裸裸的挑衅"

 brf.18.t: "公开演讲"
 brf.18.d: "食蚜蝇深吸了一口气，在向身边的几名黑客确认他们已经成功骇入全国中下层的通讯网络之后，他打开了摄像头和录音设备。面对摄像头与可能在注视自己的上万亿困惑的群众，他并没有如一贯地咆哮作为起始。与之相反，他的声音出奇地平静：\n\n“你们好，或许几年前，我还并不是什么值得被谈论的虫物。但时至今日，我们在此见面。借助信息传输的奇迹，也借助你们每个虫的双手打造的工业的奇迹。\n\n“关于我是谁的问题并不重要，因为我只是一个平凡而平庸的达利特虫类，一个有幸加入库特学院运动，并且成为学院派运动缔造者之一的虫。那些来自于达利特种姓的同胞们：我与你们感同身受，也共享着同一种苦难。我看着我的同胞与兄弟姊妹因饥饿、贫困、高种姓收集实验体，或是简单地因为赤裸裸的低贱和蔑视而死去。但正因如此，我方才看到了你们——婆罗多的大众们所具有的无限潜能。\n\n“因为我能看到，看到一个崭新的婆罗多，一个属于民众的共和国，它正在那里，正在地平线的缓缓升起的太阳上，也在你们每个虫的内心深处和你们的未来之路上。\n\n“请让革命开始吧，从马尔瓦邦到恒河，我们将创造历史。它将以血海和怒火宣告一个旧时代的终结，但在旧乐章的终末，它要开启一个新篇章。那将是一个拥有公正、正义和希望的新篇章，一个食物和尊严将不再靠哀求去换取的新时代，最重要的是，一个由你我编写与主宰的新时代！”食蚜蝇的声音虽然平淡，却也充斥着一股强大的穿透力，在贫民窟与工虫宿舍里，不断地传播。\n\n“首陀罗的工虫，请拿起武器加入我们的行列，也请你们放下对邻邦的鄙夷，加入我们的行列。达利特的拾荒者们，请用你们的双手收集能看见的武器并且破坏那些食虫的机器，那是你们在以最好的方式传达讯号——那个名为‘我不服从’的讯号。”食蚜蝇说完，便关闭了通讯系统，示意他身边的几个虫赶紧离开现场，他则一个虫静静地坐在他的椅子上。"
 brf.18.a: "演讲结束了"

 brf.19.t: "汇报：婆罗多大众同盟领袖食蚜蝇成功抓捕归案"
 brf.19.d: "在经历了一系列的波折之后，我们成功定位和抓获了婆罗多大众同盟的领袖食蚜蝇。由于广播已经发出，我们必须尽可能地保持谨慎。无需审判，食蚜蝇将被押送到附近的刑场立即处决。但与此同时，我们必须准备好应对这场演讲对国内局势造成的冲击和风暴。我们将动用大量军警和军队去镇压可能的暴论暴行，不惜一切代价。"
 brf.19.a: "此事终了？"
 brf.19.a.tt: "§R远未结束§!"

 brf.20.t: "暴动的起始"
 brf.20.d: "在押送的运载机上，食蚜蝇没有说任何话。他只是静静地看着土邦的街道。那里有着愈来愈多聚集的群众，一些虫手上还握着他们自制或是民众同盟分发的武器，而他们为数不多统一的标志就是他们当中许多虫高举的黑色战旗。一些军警正在阻拦他们的前进。\n\n“你们无法阻止这一切。”食蚜蝇开口了，这话听上去像是讲给军警听的。\n\n“至少我会干好我的本职工作。”食蚜蝇身旁的军警也开口了。但在这之后，在他们抵达刑场之前，两虫都没有再说任何话。直到抵达了室内刑场，另一名军警示意他将食蚜蝇带下来。出乎他意料的是，食蚜蝇似乎没有什么意见，依然默不作声地跟着走了下来。直到他的脚彻底落地，他最终开口了：\n\n“我不会是第一个，自然也不会是最后一个，听听虫民的咆哮吧。”军警的长官并没有把这话放在心上，他仍然示意两名军警举起电磁步枪对准食蚜蝇，但就在扳机即将被扣动的时候，外面的一阵声音突然吸引了他们的注意力。\n\n起初，是不知何时响起的一声枪响，也许是群众先开的火，也有可能是军警的走火。紧接着，便是成千上万声枪响。在愈发频繁的电磁步枪开火和爆炸，以及燃烧的声音中，军警们愣了几秒钟。但就在这时，刑场的屋顶突然间破裂开来，紧接着一台燃烧的车辆便砸了下来。虽然食蚜蝇躲开了这一次撞击，但几名不走运的军警当场被压在车辆之下，鲜血和外骨骼的碎片崩飞到了食蚜蝇的身上。而在食蚜蝇的目光中，一只长着捕捉足的苍蝇和几名首陀罗的工虫民兵也赫然出现在了他的眼前。\n\n“食蚜蝇同志，暴动已经开始了，您的预测成功了。”其中一名首陀罗工虫不禁高兴地提醒道。\n\n“那正好，我会立刻回归指挥。”食蚜蝇这么说着，那个长着捕捉足的苍蝇也将食蚜蝇身上的镣铐切断开来：\n\n“食蚜蝇同志，我们正在夺取这里的控制权，内战已经开始了。”\n\n“多谢了，螳水蝇老兄。”食蚜蝇似乎终于把握好了状态，他这么说道，然后对几名民兵强调道——"
 brf.20.a: "这不仅是暴动，也是革命"

 brf.21.t: "工厂车间（上）"
 brf.21.d: "恒河下游，孟加拉邦，多云。\n\n工厂车间，灰色眼睛，首陀罗。\n\n咔嚓咔嚓、咔嚓咔嚓……这是蝈蝈用两对足在流水线上拼装零件的声音。\n\n咔嚓，咔嚓，咔嚓……这是老螳螂用一对中足在流水线上拼装零件的声音。\n\n咔咔咔咔咔咔咔咔咔咔……这是千足虫用九十二对足在流水线上拼装零件的声音。\n\n“叔，你再讲讲你以前参加斗虫的故事呗？”\n\n“之前不是讲过了嘛。咳。没什么值得回忆的。”\n\n“四千六百九十二个……”\n\n“叔！你那是大场面，给我这没见识的再开开眼嘛！听说去了就有刹帝利老爷给你撒钱？”\n\n“想得美，你哪有那么好命。咳。护具还要自己准备呢。打赢了才有钱。”\n\n“四千七百八十四个……”\n\n“还有护具呀！那叔也打赢了，拿钱了，怎么还是回来做工？”\n\n“又不是真撒钱。咳。一个没落贵族，快破产了还硬摆着架子看斗虫，给不了多少钱。”\n\n“四千八百七十六个……”\n\n“羡慕叔啊！有空也教我几招，没准哪天用得上呢？”\n\n“得了吧。咳。那次斗的虫子少，侥幸没死。现在工钱比较稳定了，我才不玩命。”\n\n“四千九百六十八个……”\n\n“那也是因为叔有能力嘛！我要是身上也长两把折刀，高低都要去斗虫场搏一搏！”\n\n“找死。咳。我还因为这两只捕捉足装不了零件，干活比你慢呢。你看千足虫……”\n\n“厂长来了。”\n\n“厂长好。”\n\n“厂长好。”\n\n“厂长好。”\n\n“……”\n\n“……”\n\n“五千一百五十二个……”\n\n“叔，我听说厂长打算调整咱们的工钱，你知道吗？”\n\n“不知道。咳。天晓得又出什么事了。”\n\n“五千二百四十四个……”\n\n“也不知是往上调还是往下调呢！叔怎么看？”\n\n“……”\n\n“五千三百三十六个……”\n\n“叔？”\n\n“唉……”老螳螂动了动疲惫的身子，缓缓地叹一口气。"
 brf.21.a: "但求温饱，便足够了"

 brf.22.t: "工厂车间（中）"
 brf.22.d: "恒河下游，孟加拉邦，阴天。\n\n工厂车间，灰色眼睛，首陀罗。\n\n咔嚓咔嚓、咔嚓咔嚓……这是蝈蝈用两对足在流水线上拼装零件的声音。\n\n咔嚓。咔嚓。咔嚓。这是老螳螂用一对中足在流水线上拼装零件的声音。他今天咳得有些厉害，速度慢了很多。\n\n咔咔咔咔咔咔咔咔咔咔……这是千足虫用八十八对足在流水线上拼装零件的声音。他昨天回家路上被一群吠舍出身的幼虫砸伤了四只惯用的右足，现在一次只能装八十八个零件而不是九十二个了。\n\n“叔，你的病好点了吗？”\n\n“不怎么好。咳咳。这不是明显不如从前了嘛。”\n\n“四千四百八十八个……”\n\n“叔不是说家里存了南洋的药吗？效果不好吗？”\n\n“那药老早就用光了。咳咳。你再看这工钱，我现在还没把买药的贷还完呢。”\n\n“四千五百六十七个……单数？四千四百八十八……是四千五百七十六个……”\n\n“叔，我看本地也有类似的药卖，能用不？”\n\n“买不起呀。咳咳。现在什么都涨价，社会也不太平，听说西北那边还有要造反的。”\n\n“四千六百六十八个……不，不是九十二，是八十八……四千六百六十四个……”\n\n“叔啊！我在想，要是哪天日子真的过不下去了，还真不如去造……”\n\n“嘘……”\n\n“厂长来了。”\n\n“厂长好。”\n\n“厂长好。”\n\n“厂长好。”\n\n工厂的厂长是一只同样长着灰色眼睛的天牛。尽管他们都带着首陀罗的生理烙印，但一个种姓内部也是分三六九等的，首陀罗里只有更高级的亚种姓才能做工厂主这样的工作。至于同种姓里几个亚种姓对彼此的看法，则是因虫而异。这位天牛厂长就看不起那些做工虫的“小首陀罗”，并且自傲于身上那坚硬的鞘翅和长触角，俨然已经在这方天地里成为虫上虫了。反正在别的种姓面前都是被瞧不起，要是“大首陀罗”还不去鄙视一下“小首陀罗”，那不是太亏了吗？至于那些贱民达利特，不过是会说话的物件罢了，连被鄙视的价值都没有呢。\n\n“造？去造什么呀？”天牛厂长在蝈蝈身边停下脚步，假笑着问道。\n\n如果昆虫能出汗的话，蝈蝈肯定已经冷汗直流了。幸好昆虫并不能出汗，所以蝈蝈只是打了个寒战，心虚地答道：“造……当然是造机器！造大机器！就像老爷们说的，种姓合作，我们要努力给社会造大机器！嘿嘿……”蝈蝈挤出来的笑也不曾比天牛厂长真了半分。\n\n“咳咳！”老螳螂痛苦地大声咳嗽着，仿佛是在应和蝈蝈的回答。\n\n天牛厂长一边用前足玩弄着自己的一根触角，一边用中足指向门外说：“大机器，这倒是说到点上了。社会的发展总是需要大机器的。这两天工厂就在引进一批特别的大机器，叫作Auto什么……‘凹凸馒头’，总之就是自动帮你们工作的机器。”\n\n千足虫呆滞地问道：“自动帮我们工作？可是我们现在这样不也能工作吗？”\n\n“是啊，”蝈蝈着急地说，“它们做工，那我们做什么？我做的工可是又快又好啊！”\n\n“机器不会在工作时说闲话。”天牛厂长捏着触角尖端指向了蝈蝈。\n\n“还有叔做的工，他经验最多！”蝈蝈又开始为老螳螂鸣不平。\n\n“机器不会因为生病和休息而浪费时间，降低效率。”天牛厂长平静地答道。\n\n“千足虫一次能做九十多个！”\n\n“机器不会在上下班的途中受伤，也不会算错数。”天牛厂长有些不耐烦了。\n\n蝈蝈也许意识到自己有些失礼，便识相地闭了嘴了。对方好歹也是位比自己高半级的“大首陀罗”。\n\n天牛厂长指示助手把自动机运进来，然后对几位工虫说：“反正都说了，这是帮你们的。有了自动机器，你们工作中的风险也就少了嘛。当然，也不会让你们马上闲着。自动机试运行期间，你们也要和机器‘合作’完成任务，并且监管一下机器的问题，任务还是挺重的。”\n\n几位工虫面面相觑，不知是该庆幸好还是该担心好。"
 brf.22.a: "至少目前工作还在，不是吗？"

 brf.23.t: "工厂车间（下）"
 brf.23.d: "恒河下游，孟加拉邦，大雨。\n\n工厂车间，灰色钢铁，自动机。\n\n咔嚓咔嚓咔嚓，咔嚓咔嚓咔嚓……这是自动机用机械装置在流水线上拼装零件的声音。\n\n咔嚓咔嚓咔嚓，咔嚓咔嚓咔嚓……这也是自动机用机械装置在流水线上拼装零件的声音。\n\n滴答、滴答、滴答……这是树上聚成的水滴打在铁皮屋檐上的声音。\n\n自动机的工作效率毋庸置疑。它们凝聚了婆罗门的智慧，经过了刹帝利的批准，接受了吠舍的资助，最终来代替首陀罗的工作。灰色眼睛的首陀罗工虫，坐在墙角进行着最后几天的“监管”。他们心里清楚，只要时间一到，这个工厂车间便再也不是他们的容身之地。\n\n“叔，以后就是这些机器干咱们的活吗？”蝈蝈靠在墙边，扭头问老螳螂。\n\n“咳、咳、可能吧。”老螳螂止不住地咳。\n\n“一百三十四滴、一百三十五滴……”千足虫怔怔地听着铁皮屋檐上的水滴声，手脚不自觉地动，只是习惯性地想数些什么。\n\n“叔，咱们肯定是不能像老爷那样赚机器的钱了，又不可能跟那些贱民虫子一起去拾垃圾，你说这儿现在还有啥可干的？”\n\n“咳、咳、可干的不多喽。”\n\n“一百四十七滴、一百四十八滴……”\n\n“或许我应该换个地方看看。比如和几个朋友结伴，往西边的城镇去，叔觉得怎么样？”\n\n“咳、咳、可以，当然可以。但愿你在新地方能活下来。不过我这把老外骨骼，去哪儿都免不了被淘汰的。”老螳螂摇摇头，慢条斯理地整理起了怀中的布包裹。\n\n“一百六十二滴、一百六十三滴……”\n\n“但总得想办法混口饭吃嘛，那叔有什么打算？”\n\n老螳螂只是低着头不说话。\n\n“叔？”蝈蝈伸手去拨弄老螳螂的包裹。\n\n又脏又旧的布包裹里，静静地躺着几副斗虫用的护具。\n\n“叔？”蝈蝈惊疑地看向老螳螂。\n\n工厂清静得让虫不习惯，它只是以更加整齐的频率不息地震动着。\n\n咔嚓咔嚓咔嚓，咔嚓咔嚓咔嚓……\n\n恒河下游，孟加拉邦，大雨。\n\n工厂车间，灰色眼睛，首陀罗。"
 brf.23.a: "灰色的眼睛看不见希望"
