l_simp_chinese:
 BRF_automation_shock: "自动化冲击"
 BRF_automation_shock_desc: "自动化的生产机械大大提升了社会的效率，但它的附带产物——以上亿规模出现的失业工虫却影响了整个社会的稳定。愈来愈多的首陀罗和达利特正在失去他们生存的根基。倘若无法化解这场冲击，万劫不复将是婆罗多唯一的结局。"
 BRF_a_divided_society: "割裂的社会"
 BRF_a_divided_society_desc: "尽管婆罗多邦国众多，但它们大都保持在相似的文化体系之下。婆罗门、刹帝利、吠舍、首陀罗种姓互相合作、阶层分明，但这种社会的“团结”却在接连不断的冲击之下渐渐有走向崩塌的趋势。达利特与首陀罗愈发躁动，吠舍摇摆不定，婆罗门与刹帝利的矛盾也越来越大。不论结果如何，诸种姓的矛盾必须得到解决。"

 BRF_secret_assembly: "秘密集结"
 BRF_secret_assembly_desc: "愈来愈多的消息可以确认，达利特种姓出身、于《学院派宣言》中提出无政府主义理念的无政府主义之父食蚜蝇，与正在席卷婆罗多联邦的无政府主义思想有着千丝万缕的联系。首陀罗和达利特开始团结在以食蚜蝇为首的无政府主义者旗下。尽管他们行踪不定，但激进的社会复仇论和不断升级的暴力事件已为婆罗多带来了莫大的不安。"

 BRF_wisdom_of_brahman: "婆罗门的智慧"
 BRF_wisdom_of_brahman_desc: "作为整个婆罗多社会的神职虫员，婆罗门种姓在近四百年的时光里同样承担了运用另一项无价之宝——知识的职责。婆罗门同样发挥着科研人员与神秘学家的巨大作用，而这也令他们获得了不可撼动的地位。"

 BRF_shadow_of_himalayas: "喜马拉雅山脉的阴影"
 BRF_shadow_of_himalayas_desc: "作为第二次世界大战的失败者，群山帝国的复仇之火仿佛永远不会平息。山峦般庞大的都市集群已被群山帝国改造为坚固的壁垒，无数的军队正在其中操练，准备向诸夏与其它亚洲国家发起第二次征服。在喜马拉雅政府的阴影下，我们无法确定帝国的皇帝与贵族是否仍会保持与我们的天然边界。为了应对这点，唯一能做的就是做好一切准备。"

 BRF_national_emergency: "全国紧张状态"
