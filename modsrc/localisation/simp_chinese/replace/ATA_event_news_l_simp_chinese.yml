#  ata_event_news_title_1: "§c团结，自由而平等§!"
#  ata_event_news_desc_1: "§c卡文洛甲不安地坐在代表席上，他的手中紧紧攥着这次大会需要演讲的报告，眼神自动向左右瞟了瞟。其他的代表们也并非是他听说的那样，有的代表眼神中带有浓烈的不屑和否定，卡文洛甲的额头上渗出了细密的汗珠。\n\n扩音器传来了由于电磁干扰而产生的沙哑声音：“接下来……请来自新大连的杰出工虫代表……卡文洛甲同志上台发言……他也是今年劳动生产部所评定的‘劳动之星……请大家鼓掌欢迎……’”\n\n随后，在座的各位代表齐齐鼓掌，他们注视着卡文洛甲缓缓从代表席上起身，静静走向会议大厅正前方的发言台。稍微后退，清了清嗓子。他开始就像往日的工作汇报一样，再在几千名代表们面前开始了他的发言。\n\n当他讲到关于新工作指标圆满完成的时候，坐下的代表们有的开始小声嘀咕着什么东西。似乎是什么新长春派，新大连派之类的他听不懂的派系斗争，好多事情他只能通过报纸和电视上得到，虽然心中也出现了一些担忧。\n\n他只是一个默默无闻，受国家认准的勤劳的工虫，政治这个问题，就交给那帮戴眼镜的，穿长衫的吧。\n\n在联邦最高总工会中央成员们宣布代表大会结束后，全场又一次响起了热烈且持久的掌声，代表们纷纷不由自主的站了起来，大楼外高高悬挂的旗帜激情的舞动着。\n\n卡文洛甲缓缓从台阶上走了下来，微皱起眉头，轻轻拍了拍他身上那套由国家配发的代表服装。\n\n“这可真是，”他自嘲的说道：“开了个会，还染了一身灰。”§!"
#  ata_event_news_btn_1: "§c又是一年春来到§!"

 ATANews.1.t: "§c西伯利亚独立§!"
 ATANews.1.d: "§c在持续数周的混乱与暴动之后，欧亚沙皇国的西伯利亚部分已经完全恢复通讯，但向世界发出回应的却并非沙皇国在西伯利亚地区的总督。早已存在多年的西伯利亚分离主义运动于混乱中完全掌握了西伯利亚地区的局势主导权，欧亚沙皇国的八芒星旗帜被撤下烧毁，取而代之的则是绿白相间的西伯利亚联邦旗。\n\n新生的西伯利亚联邦起源于沙皇国的各个地下政治力量。他们先前联合召开“冻土会议”，达成了一致共识。随后，沙皇国对西伯利亚原住民的镇压彻底引爆了地区局势，反对欧亚沙皇国的大多数西伯利亚政治力量达成统一战线，最终在数周的大规模动乱后彻底脱离了沙皇国的控制。\n\n西伯利亚联邦的存在掀起了全球的轩然大波。欧洲的神圣梅尼加戈帝国与尤克特拉希尔帝国首先向西伯利亚联邦致电，给予了国际层面的支持。紧接着，草原之上的西里尔汗国也在计划有所行动。西伯利亚突然失控带来的连锁反应，也使欧亚沙皇国与远东地区的联络几乎被切断，沙皇国已经陷入了分崩离析的边缘。乌拉尔山以西的沙皇国——诺沃莫斯科政府已向世界宣布：将以“保卫神圣欧亚秩序，捍卫沙皇权威”为名，对西伯利亚实施全面的军事清剿。\n\n但与此同时，西伯利亚联邦内部的反叛者也并不团结，仓促成立的西伯利亚联邦临时政府已经陷入了激烈的政治博弈之中。在原住民和接纳西伯利亚文化的新斯拉夫族裔间，解放异教主义者正传播涅槃重生的神灵和所谓的“西伯利亚异教”；各个支持西伯利亚运动的巨型企业，在临时政府中同样存有一席之地；而在围绕热炉建立起的庞大都市中，以安蜂虻为首的社会无政府主义者和以堪察加蜻大蚊为首的美学主义者，也开始将他们的结社遍布城市的每一座工厂，以求得无产者的支持。临时政府中何虫将取得最终的胜利，他们将引领怎样的未来，西伯利亚的虫类正在翘首以待。但至少在当下，西伯利亚的混沌仍要持续一段时间。§!"
 ATANews.1.a: "§c欧亚浩劫的第一页§!"

 ATANews.2.t: "§c欧亚再统一§!"
 ATANews.2.d: "§c在一片混沌与血腥之后，欧亚沙皇国的正统势力终于完成了对内部分裂主义的清洗。八芒星的旗帜重新竖立于西伯利亚，沙皇与贵族在宫廷中举行了庄严的胜利演说，宣布欧亚沙皇国“永恒而不可分割”。\n\n沙皇国随即向世界宣布，将以科技手段强化对各边疆区的全面管控，异端神秘学仪式被列为“颠覆罪行”，所有边疆民族语言出版物受到严格审查。西伯利亚问题将以雷霆手段彻底解决，凡承认所谓“西伯利亚联邦”的国家，将被视为沙皇国的宿敌。然而，分析家们对此仍存疑虑——西伯利亚余波未平，远东局势同样恶劣，这头缝合伤口的巨兽能否真正愈合，仍是悬而未决的问题。§!"
 ATANews.2.a: "§c血流成河，却毫无成果§!"

 ATANews.3.t: "§c欧亚再统一§!"
 ATANews.3.d: "§c在旷日持久的战乱之后，欧亚地区的混乱终于告一段落。在内战中，美学主义者与他们的赤色军团击败了面临的一切敌对力量，建立了革命的“齿轮之诗共和国”。\n\n以艺术家联盟与工虫群体为主力、效忠于学院派美学主义的武装集团，在西伯利亚临时政府的选举中大获全胜，进而在扩军备战后成功进军东欧，彻底颠覆了沙皇国的核心权力机构。昔日总督府大楼的墙面上，沙皇的画像被构成学派的画作所覆盖；八芒星旗帜在焰火与乐声中被投入火炉。美学主义领袖堪察加蜻大蚊通过夺取的无线电台，以激昂的词句向全国宣布：“腐朽与庸俗的旧秩序已经死去，艺术将统治这片土地，美将成为欧亚新国度永恒的法律。”\n\n这个以先锋艺术取代沙皇官僚与机械神教的新政权，将如何驾驭这广袤而复杂的帝国，世界正以困惑与期待交织的目光注视着。§!"
 ATANews.3.a: "§c诗虫与工虫的共和国§!"

 ATANews.4.t: "§c欧亚再统一§!"
 ATANews.4.d: "§c来自欧亚的无线电信号混乱而嘈杂，夹杂着欢呼声与枪响声。当信号最终清晰时，传来的并非任何一位将军或政治家的宣告，而是西伯利亚联邦广播中熟悉的声音：以安蜂虻为首的社会无政府主义者宣布，无政府主义运动与虫民已击溃一切敌对势力，旧时代的沙皇与帝国宣称被废除，取而代之的是一个庞大、团结的公社联合体。\n\n社会无政府主义者长久以来便在西伯利亚的无数城市悄然发展。而在西伯利亚的起义中，他们同样站到了对抗帝国秩序的第一线。当临时政府在争论中摇摇欲坠时，无政府主义者们以迅雷不及掩耳之势完全接管局势，并达成一系列内部共识，开始向远东与东欧进军，最终解放了欧亚沙皇国的一切领土。\n\n新生的“欧亚自由地区”许诺将在其领土上实现彻底的、不加修饰的民主与自由。无数公社基于民众自发组织而建立的同时，财产与货币也被废除，取而代之的是全面集体化与资产充公。过去的沙皇国军队和军事贵族被一并废除，而由庞大的公社民兵团取代其职能。欧亚的大街小巷，无不充斥着欢呼与庆贺。\n\n“再也不会有沙皇，再也不会有总督，再也不会有任何凌驾于虫类之上的统治者。”一位被推举出的宣讲者，用因激动而颤抖的声音在广播中宣读道，“欧亚的工厂属于工虫，欧亚的土地属于所有在上面劳作的虫类，欧亚的未来属于所有无虫统治的自由虫民！”\n\n黑色的旗帜在昔日帝国的废墟上漫天飘扬。但欢庆之后，如何在这片幅员辽阔的土地上维持协调与秩序，将成为这场革命最严峻的考验。§!"
 ATANews.4.a: "§c至少于此刻，他们空前地自由§!"

 ATANews.5.t: "§c欧亚再统一§!"
 ATANews.5.d: "§c随着最后一支忠于沙皇与教会的部队停止抵抗，欧亚地区的战乱最终迎来了终结。在一片混沌之中，来自西伯利亚的解放异教主义者向世界宣布了他们的胜利。\n\n西伯利亚的解放异教主义者一直是沙皇国眼中不容小觑的政治异见势力。在西伯利亚独立运动中，他们与无政府主义者和美学主义者组成了坚固的同盟，并赢得了临时政府的大选。随着他们逐渐将西伯利亚打造为异教徒和民族解放运动支持者的天堂，沙皇与普世主义宗教的压力促使解放异教主义者与原住民运动者携手，将解放异教的烈火带向欧亚沙皇国的腹地，最终统一了整个欧亚地区。\n\n在重组欧亚沙皇国而诞生的“极昼神域共和国”之上，各地的机械神教圣像被摧毁，而来自东欧、西伯利亚与远东的古老异教神灵开始以全新的面孔重返世间——铁锤与卷轴取代了过往的圣物，赤色的祭司们高声宣讲“众神与工虫同在”的新教义，冰原之上的万神殿成为工虫代表会议的集会场所，本该消亡的神像被竭力抢救，辅以名为现代化和社会主义的良药。最终，在古老信仰感召与社会革命的双重驱动下，极昼神域共和国开始走向一个独特的时代：它试图在摩登社会呼唤众神，既追求信仰的复兴，也追求社会的革命与公正。但两者的真正平衡依然是一个耐虫寻味的问题。\n\n帝国的废墟上生长出了全新的根系，至于这些根系将养育怎样的大树：他们究竟将创造新的万神殿，还是新的机械神教，仍然无虫能够预言。§!"
 ATANews.5.a: "§c一切回归古老，一切焕然一新§!"

 ATANews.6.t: "§c婆罗多革命§!"
 ATANews.6.d: "§c自南洋燃起的学院派烈火，以缓慢却不可阻拦的趋势蔓延至南亚次大陆。随着印度河邦发生的大规模流血冲突，婆罗多的内战双方已经扣响了自己的第一枪。低种姓无政府主义者开始组织起来，成功对印度河邦的街头实现完全控制。分得武器的大量首陀罗与达利特种姓民兵开始组织起来抵御婆罗多当局的进攻，并进一步进军整个婆罗多联邦。\n\n起义军的名义领袖，大众无政府主义者的理论导师食蚜蝇，在占领的旁遮普城政府中宣读了《婆罗多解放宣言》，宣称将建立一个“彻底消灭种姓制度、消灭等级制度、消灭一切奴役”的新民众共和国。\n\n然而，无政府主义者的革命队伍——婆罗多民众同盟所掌控与接管的印度河邦开始流出大量在国际媒体中饱受争议的讯息：起义的革命者不仅建立了生产的集体化，废除种姓制度，也开始在名义领袖食蚜蝇的授意下对大量的吠舍与更高种姓阶层展开近乎灭绝式的大屠杀。大量针对性的劫掠、经革命法庭审判后的大规模处决潮开始令婆罗多联邦其余区域的高种姓虫类做好了战争准备，同时这些行为也开始在婆罗多联邦的低种姓社群中收获赞扬和追随。据民众同盟的革命运动领袖食蚜蝇所言，这一政策是对婆罗多当局恐怖统治的强硬回击。\n\n婆罗多联邦的无政府主义起义者已经在全联邦建立了或大或小的根据地。而这场战争能否为婆罗多带来正义，依然不得而知。§!"
 ATANews.6.a: "§c阴云已经笼罩了上百年，你却欲加罪于雷霆§!"

 ATANews.7.t: "§c幕府新将军就任§!"
 ATANews.7.d: "§c浩源幕府的电台以庄严的乐声作为开场，向整个东亚播报了这一消息：经幕府各大名与幕府老将军的推选，革命武士道的奠基者与精神领袖——枯叶螳，正式受任为浩源幕府的新一任将军。\n\n此次就任绝非寻常的权力传承。枯叶螳是幕府历史上首位公开以学院派理念执掌幕府最高权柄的将军，其核心主张是：武士道所倡导的荣誉、克己与礼曾指引武士们结束了漫长的战国时代，如今它却失去了重塑社会的决心——时至今日，幕府武士应再次化为为引领虫民走向阶级解放的利刃。就任仪式上，枯叶螳的追随者将旧幕府旗帜投入火中，宣称“武士道的灵魂将在烈火中重铸，以护卫亚洲的解放”。而一系列激进的社会改革政策也被提上日程：被幕府授予高度自治权的工会、大量被充公的巨型企业、下令修建的免费医院和工虫大学无不彰显这一新将军的激进主张。\n\n这一举动在东亚政治圈引起了轩然大波。诸夏方面已紧急召见外交使节，就幕府的“意识形态转向”表达关切；与此同时，东北亚联邦亦向幕府派遣了外交虫员，就幕府倒向革命者队伍一事表达祝福。而重组的浩源共和幕府也开始对东北亚联邦和南洋民族抵抗军派遣志愿军，并予以极大的物资支持。据悉，枯叶螳对他国的担忧态度明确表态：革命武士道是幕府独有的文化现象，幕府无意将幕府体制向外输出。亚细亚诸族的解放，必须由其自身的革命来完成。§!"
 ATANews.7.a: "§c支持革命的……武士？他们疯了吗？§!"

 ATANews.8.t: "§c长春派赢得东北亚联邦全国大选§!"
 ATANews.8.d: "§c经历了漫长而充满火药味的选战，东北亚联邦的全国大选终于落幕，开票结果随实时广播向全境公布。\n\n以新长春为根基、主张深化工虫联邦制度建设、维持“独角仙路线”的长春派，在与哈尔滨派、大连派、首尔派三方的激烈角力中，以较为明确的优势赢得议会多数席位，将主导下一阶段东北亚联邦的政治走向。长春派的胜利被国际上的学院派视为振奋虫心的消息：这意味着东北亚联邦将以更为坚定的姿态保持学院派理念，而非向诸夏寻求妥协。\n\n然而，胜选之夜的庆祝气氛并不如想象中的热烈。哈尔滨派工会武装部分拒绝承认计票结果，大连派的地方工会开始出现大量与其它派系民兵的冲突，首尔派的地方议会也已召开紧急会议商讨对策。独角仙及其总工会核心在掌握政权的同时，也将面临内部裂隙带来的严峻挑战。于外，诸夏的威胁从未如此强烈；于内，联邦是否真能兑现工虫的理想，仍是亿万工虫心中的疑问。§!"
 ATANews.8.a: "§c他们不会内战吧？§!"

 ATANews.9.t: "§c亚细亚学院派联盟宣告成立§!"
 ATANews.9.d: "§c在一份如惊雷般向全世界同步播出的无线电声明中，来自东北亚联邦、婆罗多民众共和国、浩源共和幕府的国家领袖宣告：亚细亚学院派联盟正式成立，作为一个革命者的同盟团结一心，共同对抗来自群山帝国与诸夏的普世主义霸权。\n\n联盟宣言援引了《学院派宣言》的核心论述，宣称将以“革命，进步，团结”三大原则推动亚洲各地被压迫虫类的彻底解放。到目前为止，亚细亚学院派联盟开始逐步凝聚为一个团结的军事同盟，而亚洲各地的学院派力量也开始得到联盟的武器支持。\n\n然而，联盟内部的路线分歧自成立之初便已显现：工虫联邦主义、无政府主义、革命武士道，以及南洋民族解放运动的激进派，各方对于联盟的战略方向看法迥异。群山帝国已明确将亚细亚学院派联盟列为头号威胁，并就此向诸夏寻求结盟。这个刚刚诞生的联盟，将在列强的围堵与内部的磨合中接受历史的检验。§!"
 ATANews.9.a: "§c让我们尽力而为§!"

 ATANews.10.t: "§c东北亚联邦对诸夏宣战§!"
 ATANews.10.d: "§c无线电静默持续整整三十分钟，随后是一段极为简短的广播：东北亚联邦总工会已正式向诸夏方面递交宣战书，理由为“诸夏普世主义对联邦主权领土的持续觊觎，以及对联邦内部无产者运动的武装干涉”。\n\n这一事件并不突兀，东北亚联邦与诸夏积怨已久——多年不断的国际封锁、边境摩擦与从未互相承认合法的政府早已将亚洲局势推至战争的边缘。宣战书下达数小时内，联邦军队即开始向边境推进，多座边境城市目击着汇聚为钢铁洪流的工虫民兵与陆地战舰。亚洲的其他学院派势力也随即发表声明，全力声援东北亚联邦。\n\n诸夏帝国的回应迅速而强硬：天子宣称将以“雷霆之力荡平东北夷虫”。与此同时，群山帝国珠穆朗玛市方面已第一时间致电诸夏，就“共同应对学院派威胁”表达合作意向——昔日的宿敌，正在共同的敌虫面前产生微妙的靠拢。§!"
 ATANews.10.a: "§c跨过黑龙江，跨过黄河，我们将解放虫民！§!"

 ATANews.11.t: "§c亚洲战争全面爆发§!"
 ATANews.11.d: "§c世界的无线电广播陷入了前所未有的混乱与嘈杂。在同一周内，东北亚前线战火正酣；群山帝国宣告对诸夏开辟第二战场，同时却在南侧遭受了婆罗多民众共和国的牵制打击；婆罗多民众共和国正在向群山帝国的都市集群进军；浩源幕府目前也已介入战争，其海军动员的消息不胫而走；匈虫与西里尔汗国也趁势宣布对“诸夏过去的暴行展开清算”，发动总攻。\n\n分析家将这一系列事件定性为：亚细亚战争正式爆发。\n\n局势的吊诡之处在于：群山帝国与诸夏虽在对抗学院派问题上存在协调意向，却仍在相互交战，形成了多方混战的复杂格局。整个亚洲犹如一张被点燃四角的巨大草纸，每一处都在燃烧。§!"
 ATANews.11.a: "§c这是战争，亦是革命§!"

 ATANews.12.t: "§c欧洲战争爆发§!"
 ATANews.12.d: "§c在多年的民族与国家矛盾之下，短命的欧亚国际联盟已无力维系欧洲的和平与自身的存续。欧洲的局势已迎来全面爆发。\n\n神圣梅尼加戈帝国向加利卡尼亚共主联邦发出最后通牒，要求后者承认帝国对争议边境地区的历史主权，并于四十八小时内撤出驻军。通牒到期，交火随即发生。\n\n欧罗巴的各个大国开始逐一表态，有些开始在两国之间周旋，有些成为了一方坚定的盟友，另一些则选择了保持中立或自成一系。神圣梅尼加戈帝国的铁甲洪流开始向西推进。加利卡尼亚共主联邦也开始激活与其他欧洲盟友的防御条约，向欧洲国家求援。东方方才摆脱内战深渊的欧亚巨兽已宣布保持中立观望——但他们于黑海和其它边界陈兵百万，展现着他们宣称的可疑。而那些学院派与改良派政治力量也开始以批判的角度评价着整场战争。第二次世界大战战场上的符文武器、炼金术阵与神秘学防御工事将再度亮相，而这场战争是否会将整个欧陆拖入万劫不复的深渊，此时的虫类尚无从得知。§!"
 ATANews.12.a: "§c战争之中无安宁§!"

 ATANews.13.t: "§c西西里起义§!"
 ATANews.13.d: "§c突如其来的新闻引发了欧洲的局势紧张化：大量的工虫民兵与退伍军队成员开始集结在西西里一带，前卫艺术家、共和派以及形形色色的激进派随即接踵而至。直到西西里当局开始被武力攻破并由起义军接管，震颤整个地中海联邦的西西里起义拉开了帷幕。\n\n这场起义并非突如其来的灾难，早在第二次世界大战结束之时它便已然出现苗头：政府依靠虫卵税收集的备用兵源迅速投放，大量的军队成员在战场出生与成长。但在战争结束之后，他们也成为了社会的多余群体。游荡的失业老兵无法融入社会，也无法得到企业曾许诺的补偿与报酬。几乎每一支地中海联邦的激进派都在向这些训练有素的老兵争取支持，其中的美学主义者和无政府主义者组建起了最为庞大的准军事组织。而当下，便是其开始行动的时刻。\n\n西西里起义者由美学主义和无政府主义者构成。其领袖分别为地中海联邦于第二次世界大战中的战争英雄、美学主义掌舵者沫蝉，以及地下工虫运动的名义领袖、纲领无政府主义的奠基者意大利蜜蜂。此时此刻，双方都集结了忠于自己的武装，并且联合起来计划发动跨越地中海联邦的革命。美学主义与无政府主义的碰撞也无疑引起了国际上的大量质疑，但目前为止，双方似乎达成了某些协议与合作，因此起义力量并未出现过大裂痕。§!"
 ATANews.13.a: "§c我们呼唤正义与热情§!"

 ATANews.14.t: "§c西西里起义者推翻地中海联邦§!"
 ATANews.14.d: "§c震惊世界的消息自地中海传来：以西西里为中心、由美学主义者和纲领无政府主义者联合组成的武装叛军，在先锋艺术家、工会与复员士兵联合结社的共同行动下，于惨烈的激战后攻克了地中海联邦的首都新威尼斯。联邦的大多数政府官员遭遇清算，叛军与革命者的旗帜升上了这片曾孕育第一台计算机的古老土地所有制高点。\n\n整场起义的两位合作领导者——沫蝉与意大利蜜蜂已达成一致意见。在起义胜利后的第一届国民大会上，美学主义者兑现了与纲领无政府主义者的承诺，由无政府主义全面接管工厂和街头秩序，联合建立新生的地中海社会共和国政权。\n\n沫蝉随即在阳台上向欢呼的民众发表演讲，宣称旧有的联合商帮政府——那“用账本统治生命的机器”——已被扫入历史的垃圾堆。新生的共和国第十社团将以神话与激情作为行动的纲领，将地中海社会自庸俗、精神瘫痪的状态中解放，并打造成引领世界走向“新纪元”的国度。而西西里革命的起始之地，将永久成为新政权的精神圣地。§!"
 ATANews.14.a: "§c欢庆吧§!"

 ATANews.15.t: "§c地中海联邦成功镇压叛军§!"
 ATANews.15.d: "§c地中海联邦的商帮政府发表声明：西西里爆发的叛乱已被彻底平定，叛军主要领导者或被击毙，或已落网。联邦军队重新进入西西里各主要城市，安全局开始对“学院派渗透网络”展开全面清查。巨型企业向世界宣布：地中海联邦的企业秩序与治理将得到坚定维护，任何以“公正”为名的颠覆图谋都将遭遇联邦的铁拳。\n\n然而，镇压叛乱所付出的惨烈代价，以及各城市中艺术家与无产者地下社团网络的传言，令外界对于联邦内部稳定与否仍存有深切疑虑。被联邦镇压所激发的悲情，或许正在为运动领袖的名字再次镀上炽热的光芒。§!"
 ATANews.15.a: "§c诗虫的末路§!"

 ATANews.16.t: "§c塔布里尼亚宣告独立§!"
 ATANews.16.d: "§c在持续了数周的混乱之后，恢复通讯的唐宁政府传出了一则足以改写欧洲局势的讯息：在混乱中，塔布里尼亚共和军自街垒中崛起，通过城市游击战和起义成功控制了唐宁市及整个不列颠岛。塔布里尼亚共和军与伦敦地铁蚊议会已达成合作，如今的塔布里尼亚已在实际上独立于加利卡尼亚共主联邦。\n\n共和军与伦敦地铁蚊议会地方派的发展早已酝酿多年：在第二次世界大战中，神圣梅尼加戈帝国轰炸农业区，拉格利亚方面阻断援助，引发了塔布里尼亚大饥荒，导致大量民众开始组建共和军展开游击战；随后，海波尼亚的支持更是让议会地方派空前地发展壮大。两者最终形成了一致意见，走向联合。时至今日，塔布里尼亚的独立便是这份团结的结果。\n\n由伦敦地铁蚊议会和塔布里尼亚共和军组成的联合政府宣布：塔布里尼亚正式脱离共主联邦，成立独立民族国家，并且不再接受任何来自拉格利亚方面的隶属关系。独立宣言由共和军成员与伦敦地铁蚊议会地方派议员在唐宁高声诵读，台下的民众高声应和。\n\n这一独立举动随即在欧洲引发了巨大的连锁反应：原共主联邦成员拉格利亚已开始向唐宁方面施压，大量的登陆部队开始筹备进攻塔布里尼亚政权；但塔布里尼亚的独立带走了共主联邦超过一半的海军舰队，也使得共主联邦展现颓势。神圣梅尼加戈帝国对此表示“密切关注”，其真实意图令虫忧虑。海波尼亚则迅速向塔布里尼亚方面致电祝贺，并且抛出了名为共同组建军事同盟的橄榄枝。塔布里尼亚能否在欧洲战火与列强环伺中守住这片刚刚宣告自由的土地，仍是悬而未决的命题。§!"
 ATANews.16.a: "§c看看世间的苦难，可听见虫民在呐喊？§!"

 ATANews.17.t: "§c唐宁革命爆发§!"
 ATANews.17.d: "§c独立后的塔布里尼亚并未迎来它所期盼的宁静。\n\n学院派工虫联邦主义在塔布里尼亚工虫与伦敦地铁蚊议会工党中积累已久的能量，在一个无线电播报失灵的深夜中彻底爆发。工厂区的沸腾虫潮打开了军械库的大门，市民议会大楼在黎明前的黑暗中被动员起来的民兵涌入。曾经带领塔布里尼亚走向独立的共和军与议会地方派，此刻却面临着与工虫反目成仇的命运。\n\n这场革命中何种理念将笑到最后，目前尚无定论。但可以确定的是：塔布里尼亚与唐宁的名字，将在历史上留下不止一次的崭新一页。§!"
 ATANews.17.a: "§c愿他们好运§!"

 ATANews.18.t: "§c海角蜜蜂民族解放军完全控制好望角§!"
 ATANews.18.d: "§c来自非洲最南端的突发新闻，打破了这片古老土地的宁静。\n\n海角蜜蜂民族解放军在工虫联邦主义与民族解放理念的双重旗帜下，完成了对奥兰治王国全域的军事接管。最后一支忠于奥兰治王国的军队已被歼灭。民族解放军发表公告，宣告好望角“虫类社会强加于海角蜜蜂族群的一切原罪已被打破”。\n\n值得外界注意的是：这支武装力量由过去曾在非洲饱受迫害的海角蜜蜂族群组建。他们是一支不存在蜂后的蜜蜂族群，过去海角蜜蜂正因这一特点遭受了奥兰治王国等非洲虫类国家的残酷迫害与屠杀，而这正是海角蜜蜂组建民族解放军的巨大推动力。民族解放军的决策来自工蜂及士兵代表委员会。目前为止，夺取全国政权的海角蜜蜂民族解放军正致力于一劳永逸地终结这片土地之上的种族迫害，为海角蜜蜂族群争取生存与获得尊严的权利，同时避免走向新的迫害与压迫。好望角新政权的建立，将以这片战略要冲为根基，向整个阿菲利加大陆进发，将暴君与普世主义者一并扫除。然而，内部各派系对民族政策、种族矛盾的态度，意识形态与经济组织的分歧，以及觊觎好望角的列强，都将是民族解放军必须直面的严峻考验。§!"
 ATANews.18.a: "§c昨日只有残留的躯壳，\n迎接光辉岁月§!"

 ATANews.19.t: "§c非洲战争爆发§!"
 ATANews.19.d: "§c好望角海角蜜蜂的胜利并未带来非洲的和平，反而成为了点燃更大战火的火星。\n\n大尼罗河帝国向撒哈拉联邦发出警告，要求撒哈拉政权承认帝国的“非洲主导权”，遭到断然拒绝。随着海角蜜蜂族群在原奥兰治王国的全面掌权，非洲南部的一系列国家也开始计划入侵并粉碎海角蜜蜂民族解放军的政权，但这些国家彼此之间也并不团结。\n\n马尔诺什军队开始向大陆沿海推进，进攻海角蜜蜂民族解放军与赞比西王国。蜘蛛神安纳西的信徒武装则向中非的部族发动攻势，非洲各地的军团和战争集群彼此周旋。刚果合众国与赤道第三共和国同样陷入冲突——与此同时，古老的非洲神秘学已被各方势力充分用于战争。这场战争，将为阿菲利加大地决出真正的秩序。§!"
 ATANews.19.a: "§c非洲的国际联盟要诞生了吗？§!"

 ATANews.20.t: "§c涅槃主义者发动军事政变§!"
 ATANews.20.d: "§c消息自北美洲传来：过去稳固驻守海岸线的新纽约邦在一场突如其来的军事政变中发生剧变。\n\n以涅槃主义理论奠基者枯叶蛾的名义集结、信奉涅槃主义的军队与市民，在一夜之间控制了新纽约邦的主要城市、通讯设施与军火库。这场军事政变的宣言并非以服从作为旗号，而带有一种罕见的学院派色彩：政变领导者在夺取的无线电台中宣读了枯叶蛾的涅槃主义纲领，宣称缔造“生命能够被尊重，虫民能生存于尊严与真正道德中的新社会”，涅槃主义者将终结屠杀、奴役与暴政，建立公正关怀社会每一份子的社会，为美洲带来“凤凰涅槃式的重生”。\n\n然而，一场以博爱与重生为旗帜发动的军事政变，是否真能兑现其许诺的温柔，北美洲的芸芸众生正以审慎而复杂的目光注视着这股新兴力量。§!"
 ATANews.20.a: "§c他们真的觉得军事政变很虫道主义吗？§!"

 ATANews.21.t: "§c美洲战争爆发§!"
 ATANews.21.d: "§c北美的火种终于蔓延成了燎原之势。\n\n新纽约邦的涅槃主义政权开始对各个临近国家与军阀发布最后通牒，这些内容包括宣战与合并政权的提议；并向北美各邦发出申请，要求承认涅槃主义理念的普世正当性。而与此同时，新纽约邦政权已经组建了一支规模极为庞大的远征军团，并通过了大量涉及社会主义政策的经济法案，同时依靠兴建学校普及了虫道主义和虫本主义教育，以巩固并加强涅槃主义革命力量。\n\n随着阿根廷蚁民族国开展心灵终结计划，南美洲的烈火王国与阿根廷蚁的漫长战争也进入决战阶段。中美洲的新玛雅帝国与新阿兹特克两大势力也开始因米克兰特危机而走向全面战争。\n\n整个美洲大陆仿佛以某种默契同时引爆——这片大地的战争，将以无数虫类的鲜血与灰烬作为终章。§!"
 ATANews.21.a: "§c所有虫都想称霸世界§!"

 ATANews.22.t: "§c新美利坚宣告建立§!"
 ATANews.22.d: "§c经历了漫长而惨烈的北美统一战争，新纽约邦的涅槃主义政权最终击溃了北美洲最后几个顽强抵抗的政权和军阀。\n\n在昔日人类文明遗迹总统山之上，新美利坚政权第一任总统枯叶蛾宣读了《新美利坚建国宣言》，宣布以涅槃主义为指导思想建立“新美利坚”，并宣称这是“一个以虫道主义与涅槃重生为基石的全新国家”。这一宣讲通过最新修建的国家电台与直播传递至新美利坚的每一条大街小巷。\n\n然而，一个以博爱重生为旗帜建立的学院派政权，能否真正在这片混战了数百年的土地上兑现其许诺，能否消解各国居民持续百年的互相憎恨与杀戮，将是检验涅槃主义理念的最终考场。南方的大国保持高度警戒，北冰洋联盟已召集紧急会议，各个被整合区域的抵抗运动据报正在秘密重组。这些现象表明，征服北美洲只是一个开始。§!"
 ATANews.22.a: "§cYou may say I'm a dreamer, but I'm not the only one§!"

 ATANews.23.t: "§c第三次世界大战爆发§!"
 ATANews.23.d: "§c所有分析家都曾说过“战争不会同时打响”——现在，他们集体沉默了。\n\n亚洲战场、欧洲战场、美洲战场，非洲战场四线同时进入全面冲突阶段，并开始出现洲际的军事与外交联动。国际观察机构宣布将这一历史时刻正式定名为：第三次世界大战。\n\n各地无线电台已全面转为战时公告，多国宣布进入战时管制状态，虫卵税率再度被强制提升以补充军队。神秘学武器的使用频率达到有史以来的峰值，据报多条前线已出现以往仅存于传说的各种大规模杀伤性武器、战争机器与宗教仪轨。世界正在燃烧。这场战争的终局，将决定虫类文明究竟走向何方——或是新秩序的诞生，或是一切的终结。§!"
 ATANews.23.a: "§c战争永不改变§!"

 ATANews.24.t: "§c南极科考站陷入混乱§!"
 ATANews.24.d: "§c在遥远的地球最南端，孤立于世界战火之外的南极自治领，也终究无法幸免于难。\n\n数个南极科考站相继陷入通讯混乱，部分科考站发出的无线电求救信号被截获——随后这些信号也消失了。南极自治领政府宣布，数个科考站“因成员来自各国，战争中就国际立场问题爆发了内战”，具体情况尚未对外公开。\n\n有记者声称，南极三大国联科考站内有虫大打出手，神秘学和人类遗迹相关研究的进展也遭遇了巨大的损失，可能引发无法预知的连锁后果。南极大陆向来是学术界与国际争夺的禁区，如今的混乱究竟意味着什么，恐怕连当局自身也难以给出答案。§!"
 ATANews.24.a: "§c淹没于暴风雪中§!"

 ATANews.25.t: "§c阿根廷蚁民族国陷入无线电静默§!"
 ATANews.25.d: "§c所有发往阿根廷蚁民族国首都巴别之城的无线电信号，突然停止了响应。极度猛烈的信号干扰导致几乎所有进入境内的通讯设备全部失联\n\n最后一次可以确认的民族国广播，是四十八小时前一段平静的气象播报。此后，所有频道陷入死寂，外界的联络请求无一得到回应，甚至连商业无线电频道也归于寂灭。附近区域的飞行侦察报告称，阿根廷蚁首都上空出现了“肉眼可见的异常神秘学能量脉冲”，具体性质不明。\n\n民族国已经成为一片信息的黑域，令整个世界为之噤若寒蝉。有知情虫士私下将此事与传说中民族国研究数十年的“心灵终结计划”相联系——这个名字曾多次出现在截获的阿根廷蚁高层通讯中，其真实内容从未被公开披露。世界正在等待，虫道主义和宗教信徒者正在为阿根廷蚁的命运而祈祷，但无虫知晓这份祈祷究竟是否真实存在效用。§!"
 ATANews.25.a: "§c到底发生了什么？§!"

 ATANews.26.t: "§c抵抗军胜利公告§!"
 ATANews.26.d: "§c打破无线电静默的并非阿根廷蚁民族国当局的广播，而是一道来自未知频道、夹杂着庆贺与爆破的信号。\n\n一个声音沙哑却语气坚定的阿根廷蚁士兵宣读了简短声明：心灵终结计划已被阻止，阿根廷蚁民族国境内的抵抗军已彻底摧毁了心灵终结仪。随后便开始呼吁国际社会立即向民族国境内派遣虫道救援力量。\n\n经通讯解释，过去被阿根廷蚁民族国隐藏了数十年的心灵终结计划也已浮出水面：这是一场由民族国技术官僚政府开展的秘密计划，通过全国各地制造的心灵神秘学装置“心灵信标”，以巴别之城中的心灵终结仪为中继器，连接一套完整的心灵控制网络，以实现对整个民族国的绝对掌控。但在心灵终结计划启动时，一部分技术官僚异见者与因无法被操纵而遭遇屠杀的少数阿根廷蚁、非阿根廷蚁虫类联合起来，制造了少量以心灵控制反制技术为支撑的反抗军，最终通过漫长的作战瘫痪并摧毁了旧民族国的全部心灵控制网络与心灵终结仪。\n\n这一消息的真实性仍有待确认。世界各地的神秘学专家与学院派信息机构均在紧急核实，部分国家政府已开始着手向阿根廷蚁方向派遣侦察力量。无论如何，这道信号是世界在最深的黑暗中收到的第一缕微弱的光。§!"
 ATANews.26.a: "§c自由！自由！自由！§!"

 ATANews.27.t: "§c大哥伦比亚革命共和国建立§!"
 ATANews.27.d: "§c在南美洲重建政府的平静的一日，一则突如其来的电报开始向世界宣告：南美洲重建政府核心官员经讨论后，全票通过大哥伦比亚革命共和国正式成立。\n\n大哥伦比亚革命共和国继承自阿根廷蚁共和抵抗军，整合了阿根廷蚁民族国和烈火王国为主的官僚机器，以及中美洲诸多城邦中被战火冲散的难民。建国宣言援引了学院派奠基理论与南美洲本土的解放传统，大哥伦比亚革命共和国宣称将在这片土地上建立一个“消除种族主义，属于所有虫类的家园”。\n\n大哥伦比亚革命共和国开始在重建之余展开大规模经济与政治重组，过去的少数虫类聚落与阿根廷蚁社区的界限开始被消除，激进的平等教育和指令经济体制也随之一并提出。但这无疑招致了大量的疑问，例如继承自阿根廷蚁民族国的技术官僚不可能在这些激进议题上如此一致同意，一些观察与流言蜚语表示似乎有类似心灵神秘学能量脉冲的讯号在各地政府中被捕捉，但这些声音很快便被淹没在了民族国群众对革命共和国的赞扬中。§!"
 ATANews.27.a: "§c很可疑，但结果不错§!"
