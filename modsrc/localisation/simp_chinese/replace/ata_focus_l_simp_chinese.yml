l_simp_chinese:
 BRF_responding_to_the_crisis: "应对危机"
 BRF_responding_to_the_crisis_desc: "过去曾被寄予厚望的自动化生产对联邦的社会产生了巨大的冲击——尽管没有虫真的希望它发生。首陀罗——占社会主要虫口百分之八十以上的庞大群体正在一批批地失去工作和生活。如果他们能安然离去，状况也不会演变到如此地步。但我们不得不承认：它的后果已经庞大到难以承受，以无政府主义者为首的学院派匪帮正借由社会的混乱而发展壮大，他们的状况必须被调查清楚……否则婆罗多诸邦注定要万劫不复。"

 BRF_appease_the_masses: "安抚群众"
 BRF_appease_the_masses_desc: "为了应对当今社会面临的庞大冲击，我们必须让虫民适当地保持安分。一系列承诺已经在各个邦之间许下。我们必须让各个种姓重新明确他们在社会秩序中的位置，并且在条件允许的情况下，解决我们社会正面临的重大危机。"

 BRF_carnival: "嘉节庆典"
 BRF_carnival_desc: "在这个紧张的关头，我们不得不需要一场嘉节庆典来处理民众无处安放的焦虑和不安。为筹备这次全国庆典，我们特意选取了一批舞者在全国巡演。他们的舞姿将令虫暂时地忘却苦难和正在撕裂的社会——而这时，我们便必须拟定足以化解危机的最好方案。"

 BRF_Emergency_investigation: "紧急调查行动"
 BRF_Emergency_investigation_desc: "不可置信的暴行已经发生，而这也是近日频发的恐怖袭击中最为众目睽睽的一次。现在，我们的舞者在全国各地民众的注视下遭遇了刺杀，一切线索又指向了一个正在活跃的学院派恐怖组织——而这仅仅是它的冰山一角。但对我们的政府官员来说，这却也让他们难得地安心：终于发生了些什么！\n\n如今，任何一个土邦都已不可能独善其身了，诸土邦必须立即对这赤裸裸的恐怖暴行展开联合调查，我们的侦探与情报员将在任何一个土邦通行无阻。不论如何，我们必须在一切不可挽回之前确认状况。"
